# Set LIBERO_PRO_ROOT or use a local path below. Other asset paths are derived automatically.
libero_pro_root: ""

# Enable one perturbation type for each evaluation panel.
# Environment perturbations require generated or downloaded OOD assets.
use_environment: false
use_swap: false
use_object: false
use_language: false
use_task: false

perturbation_mapping:
  use_environment: env
  use_swap: swap
  use_object: object
  use_language: lan
  use_task: task
